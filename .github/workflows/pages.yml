name: Deploy DiceSecret

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Verify manifest and stage exact site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import shutil

          root = Path(".")
          manifest_path = root / "build-manifest.json"
          manifest = json.loads(manifest_path.read_text())

          site = root / "_site"
          if site.exists():
              shutil.rmtree(site)
          site.mkdir()

          for relative, expected in sorted(manifest["assets"].items()):
              source = root / relative

              if not source.is_file():
                  raise SystemExit(f"missing manifested asset: {relative}")

              payload = source.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()

              if digest != expected["sha256"]:
                  raise SystemExit(
                      f"SHA-256 mismatch for {relative}: "
                      f"expected {expected['sha256']}, got {digest}"
                  )

              if len(payload) != expected["bytes"]:
                  raise SystemExit(
                      f"size mismatch for {relative}: "
                      f"expected {expected['bytes']}, got {len(payload)}"
                  )

              destination = site / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(payload)

          shutil.copy2(manifest_path, site / "build-manifest.json")

          print(f"Verified and staged {len(manifest['assets'])} manifested assets")
          print(f"DiceVision source commit: {manifest['source_commit']}")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload exact site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
